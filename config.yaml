dataset:
  version: "v1.0-mini"
  dataroot: "data/nuscenes"

vectorise:
  prob_threshold: 0.3
  use_drivable_gate: true
  drivable_dilate_kernel: 31
  min_pixel_count: 20
  min_vertical_extent: 20
  max_wh_ratio: 5.0

project:
  clip_x: [0.0, 50.0]
  clip_y: [-15.0, 15.0]
  confidence_decay_rate: 0.02

stitch:
  heading_n_points: 5
  gate_dist_m: 1.5
  gate_angle_deg: 45.0
  cost_angle_weight: 1.0
  bin_spacing_m: 0.5
  savgol_polyorder: 2
  max_misses: 3
  duplicate_gate_dist_m: 1.0
  duplicate_gate_angle_deg: 15.0
